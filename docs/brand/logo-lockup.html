<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home Screen Organizer logo lockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* The editor's header logo (web/index.html .brand) drawn four times larger. */
  html, body { margin: 0; padding: 0; background: transparent; }
  .lockup {
    --scale: 4;
    display: inline-flex; align-items: center; gap: calc(10px * var(--scale));
    padding: 40px;
    font-family: "Inter", -apple-system, "Helvetica Neue", sans-serif;
  }
  .mark {
    width: calc(36px * var(--scale)); height: calc(36px * var(--scale));
    padding: calc(5px * var(--scale)); border-radius: calc(10px * var(--scale));
    box-sizing: border-box;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: calc(2px * var(--scale));
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 55%, #172554 100%);
    box-shadow: 0 0 calc(10px * var(--scale)) calc(-2px * var(--scale)) rgba(59, 130, 246, .45);
  }
  .cell { border-radius: calc(2px * var(--scale)); background: rgba(191, 219, 254, .35); }
  .cell.active { background: #60a5fa; }
  .cell.dashed {
    background: none; border: calc(1px * var(--scale)) dashed rgba(191, 219, 254, .55);
    display: grid; place-items: center;
  }
  .dot { width: calc(3px * var(--scale)); height: calc(3px * var(--scale)); border-radius: 50%; background: #f59e0b; }
  .word { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
  .line1 { font-size: calc(10px * var(--scale)); font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
  .line2 { font-size: calc(13px * var(--scale)); font-weight: 700; letter-spacing: .02em; margin-top: calc(1px * var(--scale)); }
  body.light .line1 { color: #0b0f19; }
  body.light .line2 { color: #2563eb; }
  body.dark .line1 { color: #f3f4f6; }
  body.dark .line2 { color: #60a5fa; }
</style>
</head>
<body class="light">
  <div class="lockup">
    <div class="mark">
      <span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell active"></span><span class="cell dashed"><span class="dot"></span></span>
      <span class="cell"></span><span class="cell"></span><span class="cell"></span>
    </div>
    <div class="word">
      <span class="line1">Home Screen</span>
      <span class="line2">ORGANIZER</span>
    </div>
  </div>
<script>
  document.body.className = new URLSearchParams(location.search).get('theme') || 'light'
</script>
</body>
</html>
